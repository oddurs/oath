[package]
name = "oath-lang"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A language where every call resolves to a body sworn against a hashed contract"
license = "MIT"
repository = "https://github.com/oddurs/oath"

# One crate. A split earns its place when compile times demand it. Modules
# arrive with the work that needs them: syntax with the lexer, eval with the
# evaluator, oath with hashing and the store.
[[bin]]
name = "oath"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

# A panic on a user's program is a diagnostic nobody can act on, so the ways of
# writing one are denied rather than discouraged. `expect` is left alone: with a
# message it states an invariant, which is the sanctioned way to say why a case
# cannot happen. Test modules allow these back in, since a failed assertion is
# exactly how a test reports.
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[dev-dependencies]
insta = "1.48.0"
