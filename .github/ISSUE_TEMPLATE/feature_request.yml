name: Feature request
description: Something the language or the tooling should be able to do
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do today. Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Concrete enough to argue with — a syntax sketch, a flag, a signature.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you considered instead
      description: And why it was worse. This is the most useful part of a proposal.
